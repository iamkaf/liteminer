name: Release

# Builds the jars of one commit and hands them to the build host.
# Dispatched with the identifiers the host expects; the run name carries the build id.
run-name: Release build ${{ inputs.build-id }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: graph or release
        required: true
        type: choice
        options: [graph, release]
      commit:
        description: Full commit SHA to build.
        required: true
        type: string
      versions:
        description: Comma-separated Minecraft versions. Leave blank for all.
        required: false
        type: string
      loaders:
        description: Comma-separated loaders. Leave blank for all.
        required: false
        type: string
      build-id:
        description: Build identifier.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    uses: iamkaf/multiloader-conventions/.github/workflows/release-build.yml@7c61e191722db74d8192b84bc68034a980bf74ca
    with:
      kind: ${{ inputs.kind }}
      commit: ${{ inputs.commit }}
      versions: ${{ inputs.versions }}
      loaders: ${{ inputs.loaders }}
      build-id: ${{ inputs.build-id }}

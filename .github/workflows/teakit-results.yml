name: Comment TeaKit results

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    uses: iamkaf/multiloader-conventions/.github/workflows/comment-teakit.yml@f7acde0d5e9eefc982c6a5baf17f339e4494c8a7

name: Publish Maven Artifacts

# The run name carries the build id, so the build host finds exactly the run it dispatched.
run-name: Publish Maven artifacts ${{ inputs.build-id }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to publish. Leave blank to use the selected ref.
        required: false
        type: string
      versions:
        description: Comma-separated Minecraft versions from versions/<version>. Leave blank to publish all.
        required: false
        type: string
      loaders:
        description: Comma-separated loaders. Leave blank to publish every loader.
        required: false
        type: string
      common:
        description: Publish the Common artifact of each version.
        required: false
        type: boolean
        default: true
      build-id:
        description: Identifier the build host knows this run by. Leave blank by hand.
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Publishing trades GitHub's OIDC token for a Kaf Maven publish token.
  id-token: write

jobs:
  publish:
    uses: iamkaf/multiloader-conventions/.github/workflows/publish-maven.yml@7c61e191722db74d8192b84bc68034a980bf74ca
    with:
      commit: ${{ inputs.commit }}
      versions: ${{ inputs.versions }}
      loaders: ${{ inputs.loaders }}
      common: ${{ inputs.common }}
